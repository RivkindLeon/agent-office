name: governance

on:
  push: { branches: [main] }
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Тесты governance-скриптов
        run: node --test org/tools/*.test.mjs
      - name: Журнал против схемы
        run: node org/tools/validate-journal.mjs
      - name: Оргструктура собрана из состояния
        run: node org/tools/org.mjs --check
      - name: Золотые сценарии компании
        run: node org/tools/scenarios.mjs
      - name: Пакеты действующих должностей
        run: node org/tools/check-all.mjs
